<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do list</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 40px auto;
        padding: 0 16px;
      }
      form {
        display: flex;
        gap: 8px;
      }
      input[type="text"] {
        flex: 1;
        padding: 8px;
      }
      button {
        padding: 8px 12px;
        cursor: pointer;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid #ddd;
      }
      li span {
        flex: 1;
      }
      .done {
        text-decoration: line-through;
        color: #666;
      }
      #message {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h1>To-do list</h1>

    <form id="add-form">
      <input id="task-input" type="text" placeholder="What needs doing?" />
      <button type="submit">Add</button>
    </form>
    <p id="message"></p>

    <ul id="todo-list"></ul>

    <script src="main.js"></script>
  </body>
</html>
